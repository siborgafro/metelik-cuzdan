<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1b33">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- black-translucent iOS 26'da görünüm yüksekliğini kısaltıyor: alt menü yukarıda kalıp altında boşluk açılıyordu -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Metelik Cüzdan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Renkler logodan: lacivert zemin, krem, altın. Koyu tema bilinçli (Afro kararı). */
:root{--bg:#0f1b33;--card:#16264a;--card2:#1b2d55;--line:#26395f;--cream:#f3ead2;--gold:#d9a93b;--gold-h:#e4b851;--mute:#9aa6c4;--red:#ef8a82;--green:#7fcf9c;--share:#5b6a8f;
  --r-sm:6px;--r-md:8px;--r-lg:12px;--disp:'Bricolage Grotesque',system-ui,sans-serif;--body:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;
  --navh:60px;--navb:env(safe-area-inset-bottom)}
*{box-sizing:border-box}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--cream);font:400 15px/1.45 var(--body);-webkit-font-smoothing:antialiased;
  padding-bottom:calc(var(--navh) + var(--navb) + 96px)}
/* ana ekrandan açılınca sayfa çentik ve durum çubuğunun altına uzanır; güvenli alan kadar boşluk bırak */
main{max-width:540px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 16px calc(16px + env(safe-area-inset-left))}
button{font:inherit;color:inherit;cursor:pointer}
.ico{width:18px;height:18px;flex:none;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;vertical-align:-3px}
.ico.s{width:14px;height:14px;vertical-align:-2px}
h1{font:700 26px/1.1 var(--disp);letter-spacing:-.01em;margin:0 0 14px;color:var(--cream)}
h2{font:500 13px/1.3 var(--body);color:var(--mute);margin:26px 0 8px}
.brand{display:flex;align-items:center;gap:10px;margin:0 0 14px}
.brand img{width:30px;height:30px;border-radius:var(--r-sm)}
.brand h1{margin:0;font-size:22px}
.big,.stat b,.amt,.split b{font-family:var(--disp);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);padding:12px 14px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mute{color:var(--mute);font-size:13px}
.in{color:var(--green)}.out{color:var(--red)}
b{font-weight:500}
/* üst özet: sayfanın tek baskın öğesi */
.hero{background:var(--card2);border-color:#30467a;padding:16px 16px 14px;margin-bottom:10px}
.hero .big{font-size:36px;font-weight:700;line-height:1.05;margin:4px 0 12px;color:var(--cream)}
.split{display:grid;grid-template-columns:1fr 1fr;border-top:1px solid var(--line);padding-top:10px;gap:12px}
.split>div+div{border-left:1px solid var(--line);padding-left:12px}
.split b{display:block;font-size:17px;font-weight:700;margin-top:2px}
.hero .extra{margin-top:10px;padding-top:8px;border-top:1px solid var(--line)}
/* ay sonucu: üç sütunlu şerit, sonuç vurgulu */
.stats{display:grid;grid-template-columns:1fr 1fr;padding:0;overflow:hidden}
.stat{padding:12px 14px;min-width:0}
.stat+.stat{border-left:1px solid var(--line)}
.stat b{display:block;font-size:17px;font-weight:700;margin-top:2px;overflow-wrap:anywhere}
.stat.res{grid-column:1/-1;border-left:0;border-top:1px solid var(--line);background:var(--card2);display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.stat.res b{font-size:20px;margin:0}
/* çubuklar */
.bar{height:6px;border-radius:3px;background:var(--line);margin:8px 0 6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.bar i.share{background:var(--share)}.bar i.ok{background:var(--green)}.bar i.warn{background:var(--gold)}.bar i.over{background:var(--red)}
/* liste: kart başına tek kayıt yerine gruplanmış defter görünümü */
.list{background:var(--card);border:1px solid var(--line);border-radius:var(--r-md);margin-bottom:8px;overflow:hidden}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 10px 11px 14px}
.item+.item{border-top:1px solid var(--line)}
.item .l{min-width:0}
.item .r{display:flex;align-items:center;gap:2px;flex:none}
.amt{font-weight:700;font-size:15px;white-space:nowrap}
.cat-row{display:block;padding:12px 14px}
.cat-row+.cat-row{border-top:1px solid var(--line)}
/* alt menü: sabit, düz zemin, üst çizgi */
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;background:#0c1629;border-top:1px solid var(--line);
  padding:0 env(safe-area-inset-right) var(--navb) env(safe-area-inset-left)}
nav .in-nav{max-width:540px;margin:0 auto;display:flex}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;height:var(--navh);justify-content:center;background:none;border:0;color:var(--mute);font-size:12px;position:relative;transition:color .15s}
nav button .ico{width:22px;height:22px}
nav button[aria-current="page"]{color:var(--gold);font-weight:500}
nav button[aria-current="page"]::before{content:"";position:absolute;top:-1px;left:28%;right:28%;height:2px;background:var(--gold);border-radius:0 0 2px 2px}
nav button:hover{color:var(--cream)}
nav button[aria-current="page"]:hover{color:var(--gold)}
.fab{position:fixed;right:max(calc(18px + env(safe-area-inset-right)),calc((100vw - 540px)/2 + 18px));bottom:calc(var(--navh) + var(--navb) + 16px);width:56px;height:56px;border-radius:50%;border:0;background:var(--gold);color:var(--bg);z-index:10;
  display:flex;align-items:center;justify-content:center;box-shadow:0 6px 18px rgba(0,0,0,.45);transition:background-color .15s,box-shadow .15s}
.fab .ico{width:26px;height:26px;stroke-width:2.4}
.fab:hover{background:var(--gold-h);box-shadow:0 8px 24px rgba(0,0,0,.55)}
/* form paneli: alttan açılan <dialog>, Esc ile kapanır */
dialog#sheet{border:0;padding:0;margin:auto auto 0;width:100%;max-width:540px;background:transparent;color:var(--cream);max-height:calc(100dvh - env(safe-area-inset-top) - 12px)}
dialog#sheet::backdrop{background:rgba(3,8,20,.7)}
dialog#sheet form{background:var(--bg);border:1px solid var(--line);border-bottom:0;border-radius:var(--r-lg) var(--r-lg) 0 0;padding:18px 16px calc(16px + env(safe-area-inset-bottom));max-height:calc(100dvh - env(safe-area-inset-top) - 12px);overflow:auto}
dialog#sheet[open]{animation:up .2s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.ftitle{font:700 18px/1.2 var(--disp);display:block;margin-bottom:4px}
label{display:block;font-size:13px;color:var(--mute);margin:12px 0 5px}
input,select{width:100%;padding:11px 12px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);color:var(--cream);font:400 16px var(--body);transition:border-color .15s}
input:hover,select:hover{border-color:#3a5283}
input:user-invalid{border-color:var(--red)}
input::placeholder{color:#8591ae}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px 6px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);color:var(--mute);font-size:14px;transition:background-color .15s,color .15s}
.seg button.on{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:500}
.btn{width:100%;padding:13px;border-radius:var(--r-sm);border:0;background:var(--gold);color:var(--bg);font-size:15px;font-weight:500;margin-top:14px;transition:background-color .15s}
.btn:hover{background:var(--gold-h)}
.btn.alt{background:transparent;color:var(--cream);border:1px solid var(--line)}
.btn.alt:hover{background:var(--card)}
.btn.add{display:flex;align-items:center;justify-content:center;gap:8px;margin:0 0 6px}
.del{background:none;border:0;color:var(--mute);padding:8px;border-radius:var(--r-sm);display:inline-flex;transition:color .15s,background-color .15s}
.del:hover{color:var(--red);background:var(--card2)}
.mini{background:var(--gold);color:var(--bg);border:0;border-radius:var(--r-sm);padding:7px 12px;font-weight:500;font-size:14px;transition:background-color .15s}
.mini:hover{background:var(--gold-h)}
.mini.alt{background:transparent;color:var(--cream);border:1px solid var(--line);margin-right:6px}
.mini.alt:hover{background:var(--card2)}
/* düzenlenebilir satır başlığı: gerçek buton */
.hit{background:none;border:0;padding:0;text-align:left;display:block;min-width:0;border-radius:var(--r-sm)}
.hit .t{display:flex;align-items:center;gap:6px;font-weight:500}
.hit .t .ico{color:var(--mute)}
.hit:hover .t .ico{color:var(--gold)}
.hit .mute{display:block}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.cat{display:inline-flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:2px 2px 2px 12px;font-size:14px}
.cat button{background:none;border:0;color:var(--mute);padding:6px 8px;border-radius:999px;display:inline-flex}
.cat button:hover{color:var(--red)}
.rtab{padding:0}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line)}
.rrow.skip .l,.rrow.skip .amt{opacity:.55}.rr{display:flex;flex-direction:column;align-items:flex-end;gap:5px}
.chip{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:2px 8px}.chip.in{color:var(--green);border-color:#2f5a44}
.rsum{padding:11px 14px;flex-wrap:wrap;background:var(--card2)}
.stmt{border-top:1px solid var(--line);margin-top:10px;padding-top:10px;display:grid;gap:6px}
.month{display:flex;justify-content:space-between;align-items:center;margin:0 0 12px}
.month b{font:500 16px var(--disp);text-transform:capitalize}
.month button{width:40px;height:40px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--card);display:flex;align-items:center;justify-content:center;transition:background-color .15s}
.month button:hover{background:var(--card2)}
.empty{padding:18px 14px;text-align:center}
:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
input:focus-visible,select:focus-visible{outline-offset:0;border-color:var(--gold)}
/* masaüstü öğeleri telefonda gizli; .cols/.grid telefonda sıradan blok */
nav .nbrand,nav .nadd{display:none}
/* masaüstü: alt menü sola kenar çubuğu olur, içerik geniş alana iki sütun yayılır */
@media (min-width:1000px){
  :root{--side:232px}
  body{padding-bottom:40px}
  nav{top:0;right:auto;width:var(--side);border-top:0;border-right:1px solid var(--line);padding:22px 14px}
  nav .in-nav{flex-direction:column;gap:4px;max-width:none}
  nav .nbrand{display:flex;align-items:center;gap:10px;margin:0 6px 22px}
  nav .nbrand img{width:30px;height:30px;border-radius:var(--r-sm)}
  nav .nbrand b{font:700 19px/1.1 var(--disp)}
  nav .nadd{display:flex;flex:none;flex-direction:row;height:auto;font-size:15px;align-items:center;justify-content:center;gap:8px;margin:0 0 14px;padding:11px;border:0;border-radius:var(--r-sm);background:var(--gold);color:var(--bg);font-weight:500;transition:background-color .15s}
  nav .nadd:hover{background:var(--gold-h);color:var(--bg)}
  nav button[data-tab]{flex:none;flex-direction:row;justify-content:flex-start;gap:12px;height:44px;padding:0 12px;border-radius:var(--r-sm);font-size:15px}
  nav button[data-tab] .ico{width:20px;height:20px}
  nav button[data-tab]:hover{background:var(--card)}
  nav button[aria-current="page"]{background:var(--card)}
  nav button[aria-current="page"]::before{top:10px;bottom:10px;left:0;right:auto;width:3px;height:auto;border-radius:0 2px 2px 0}
  .fab{display:none!important}
  main{max-width:1180px;margin:0 0 0 var(--side);padding:28px 40px 0}
  @media (min-width:1460px){main{margin-left:calc(var(--side) + (100vw - var(--side) - 1180px)/2)}}
  main>.brand{display:none}
  h1{font-size:30px;margin-bottom:18px}
  .month{max-width:360px}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;align-items:start}
  .cols.top{gap:16px;align-items:stretch}
  .cols.top>.card{margin:0}
  .cols.wide{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr)}
  .cols.wide>.col:first-child{order:2}
  .cols>.col>h2:first-child{margin-top:26px}
  .cols.one{grid-template-columns:minmax(0,1fr)}
  .hero .big{font-size:42px}
  .stats{grid-template-rows:1fr auto}
  .stat.res{align-items:center}
  .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px;align-items:start;margin-bottom:14px}
  .grid>.card{margin:0}
  .btn.add{width:auto;display:inline-flex;padding:11px 20px}
  .acols{column-count:2;column-gap:16px}
  .acols>.card{break-inside:avoid;display:inline-block;width:100%;margin:0 0 16px}
  dialog#sheet{margin:auto;max-width:480px}
  dialog#sheet form{border-bottom:1px solid var(--line);border-radius:var(--r-lg);padding-bottom:18px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<main id="app"></main>
<button class="fab" id="fab" aria-label="İşlem ekle"><svg class="ico" aria-hidden="true"><use href="#i-plus"/></svg></button>
<nav id="nav" aria-label="Bölümler"></nav>
<dialog id="sheet" aria-label="Kayıt formu"><form id="form"></form></dialog>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="i-plus" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></symbol>
<symbol id="i-x" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></symbol>
<symbol id="i-edit" viewBox="0 0 24 24"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></symbol>
<symbol id="i-check" viewBox="0 0 24 24"><path d="M20 6 9 17l-5-5"/></symbol>
<symbol id="i-repeat" viewBox="0 0 24 24"><path d="m17 2 4 4-4 4"/><path d="M3 11v-1a4 4 0 0 1 4-4h14"/><path d="m7 22-4-4 4-4"/><path d="M21 13v1a4 4 0 0 1-4 4H3"/></symbol>
<symbol id="i-left" viewBox="0 0 24 24"><path d="m15 18-6-6 6-6"/></symbol>
<symbol id="i-right" viewBox="0 0 24 24"><path d="m9 18 6-6-6-6"/></symbol>
<symbol id="i-alert" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></symbol>
<symbol id="i-ozet" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="m7 15 4-4 3 3 5-6"/></symbol>
<symbol id="i-islem" viewBox="0 0 24 24"><path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/></symbol>
<symbol id="i-hesap" viewBox="0 0 24 24"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M2 10h20M16 15h2"/></symbol>
<symbol id="i-ayar" viewBox="0 0 24 24"><path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/></symbol>
</svg>

<script>
/* varsayılanlar; kullanıcı Ayarlar'dan ekler/siler, liste S.cats içinde saklanır */
const KAT=t=>S.cats[t];
const DEF_KAT={gider:['Market','Yemek','Fatura','Abonelik','Ulaşım','Kira','Sağlık','Eğlence','Alışveriş','Kahve','Diğer'],gelir:['Maaş','Yemek kartı yüklemesi','Ek gelir','Diğer']};
const TIP={nakit:'Nakit',banka:'Banka',kart:'Kredi kartı',yemek:'Yemek kartı'};
let S={accounts:[],tx:[],budgets:{},recurring:[],cats:JSON.parse(JSON.stringify(DEF_KAT)),deleted:{},meta:{}},tab='ozet',month;

/* --- depolama (IndexedDB) --- */
const db=new Promise((res,rej)=>{let r;try{r=indexedDB.open('metelik',1)}catch(e){return rej(e)}r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
db.catch(()=>{});
async function kvGet(k){try{const d=await db;return await new Promise(res=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}catch{return null}}
async function kvPut(k,v){try{const d=await db;await new Promise(res=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=t.onerror=res})}catch{}}
const load=()=>kvGet('state');
async function persist(){await kvPut('state',JSON.parse(JSON.stringify(S)))}
async function save(){stamp();await persist();scheduleSync()}

/* --- değişiklik damgası ---
   Her kayıt değiştiğinde u = zaman; silinen kayıt S.deleted["tür:id"] = zaman olarak iz bırakır.
   Damgalama save() içinde son kaydedilen hâlle karşılaştırılarak yapılır; tek tek işlemlere dokunmak gerekmez. */
const COLS=['accounts','tx','recurring'],FIELDS=['budgets','cats'];
let SNAP=null;
function snapOf(){const m={};
  for(const c of COLS)for(const x of S[c]){const {u,...r}=x;m[c+':'+x.id]=JSON.stringify(r)}
  for(const f of FIELDS)m[f]=JSON.stringify(S[f]);return m}
function stamp(){const now=Date.now(),cur=snapOf();
  if(SNAP){for(const c of COLS)for(const x of S[c]){const k=c+':'+x.id;if(SNAP[k]!==cur[k])x.u=now}
    for(const k in SNAP)if(k.includes(':')&&!(k in cur))S.deleted[k]=now;
    for(const f of FIELDS)if(SNAP[f]!==cur[f])S.meta[f]=now}
  SNAP=cur}
/* iki sürümü birleştir: kayıt bazında yeni olan kazanır, silme izi kayıttan yeniyse kayıt düşer */
function merge(A,B){
  const out={deleted:{...A.deleted},meta:{}};
  for(const k in B.deleted)out.deleted[k]=Math.max(out.deleted[k]||0,B.deleted[k]);
  for(const c of COLS){const m=new Map();
    for(const x of [...A[c],...B[c]]){const o=m.get(x.id);
      if(!o)m.set(x.id,x);
      else{const w=(x.u||0)>(o.u||0)?x:o;
        m.set(x.id,c==='recurring'?{...w,done:[...new Set([...(o.done||[]),...(x.done||[])])]}:w)}}
    out[c]=[...m.values()].filter(x=>!(out.deleted[c+':'+x.id]>=(x.u||0)))}
  for(const f of FIELDS){const a=A.meta[f]||0,b=B.meta[f]||0;out[f]=b>a?B[f]:A[f];out.meta[f]=Math.max(a,b)}
  return out}

/* --- şifreli senkron (özel GitHub reposundaki tek dosya) ---
   Ayar cihazda kalır, senkron edilmez. Şifre saklanmaz; ondan türetilen, dışa aktarılamayan anahtar saklanır. */
const SY={cfg:null,busy:false,again:false,last:null,err:''};
const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode(...u8.subarray(i,i+8192));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pass,salt){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(obj,key,salt){const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));
  return JSON.stringify({v:1,salt:b64(salt),iv:b64(iv),ct:b64(new Uint8Array(ct))})}
async function unseal(txt,key){const f=JSON.parse(txt);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(f.iv)},key,unb64(f.ct));return JSON.parse(new TextDecoder().decode(pt))}
function gh(cfg,path,opt={}){return fetch(`${cfg.api||'https://api.github.com'}/repos/${cfg.owner}/${cfg.repo}/${path}`,{cache:'no-store',...opt,
  headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json',...(opt.body?{'Content-Type':'application/json'}:{})}})}
const FILE='contents/metelik.json';
/* uzak dosya: {sha,text} ya da yoksa null */
async function remoteGet(cfg){
  const r=await gh(cfg,FILE);if(r.status===404)return null;
  if(!r.ok){const m=(await r.json().catch(()=>({}))).message||'';

  SY.busy=true;SY.err='';syncBadge();
  try{for(let i=0;i<4;i++){
      const rem=await remoteGet(cfg),R=rem?await unseal(rem.text,cfg.key):null,M=R?merge(S,R):S;
      if(canon(M)!==canon(S)){Object.assign(S,M);SNAP=snapOf();await persist();render()}
      if(R&&canon(M)===canon(R))break;
      if(await remotePut(cfg,await seal(S,cfg.key,unb64(cfg.salt)),rem?.sha))break;

  catch(e){SY.err=e.name==='OperationError'?'Senkron şifresi bu veriyi açamadı.':e.message||'Bağlantı hatası'}

/* sıra bağımsız karşılaştırma: anahtarlar ve id'li diziler sıralanır */

  const s=v=>Array.isArray(v)?v.map(s).sort((a,b)=>{const x=key(a),y=key(b);return x<y?-1:x>y?1:0})
  :v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,s(v[k])])):v;
  return JSON.stringify(s({accounts:o.accounts,tx:o.tx,recurring:o.recurring,budgets:o.budgets,cats:o.cats,deleted:o.deleted,meta:o.meta}))}

function delta(t,a){if(t.type==='gelir'&&t.acc===a)return t.amount;if(t.type==='gider'&&t.acc===a)return -t.amount;if(t.type==='transfer'){if(t.acc===a)return -t.amount;if(t.to===a)return t.amount}return 0}

function ekstre(a){

  const [ty,tm]=today().split('-').map(Number);
  let lc=cutDate(ty,tm-1,a.cut);if(lc>today())lc=cutDate(ty,tm-2,a.cut);
  const [y,m]=lc.split('-').map(Number),nc=cutDate(y,m,a.cut),due=addDays(lc,a.dueDays??10);

  const spend=(from,to)=>S.tx.filter(t=>t.acc===a.id&&(t.type==='gider'||t.type==='transfer')&&t.date>from&&t.date<=to).reduce((s,t)=>s+t.amount,0);
  const rem=Math.max(0,stmt-paid);

/* --- tekrar eden giderler ---
   r.start: ilk ay (YYYY-MM), r.done: işlenmiş aylar (ödendi/atlandı/otomatik eklendi).
   İşlem silinse de ay "done" kaldığı için tekrar oluşmaz. */
function recMonths(r){const out=[];let [y,m]=r.start.split('-').map(Number);const [ty,tm]=today().split('-').map(Number);
  while(y<ty||(y===ty&&m<=tm)){out.push(`${y}-${String(m).padStart(2,'0')}`);if(++m>12){m=1;y++}}return out}

function pendingRecs(){

    for(const mo of recMonths(r)){
      if(r.done.includes(mo))continue;const date=recDate(r,mo);if(date>today())continue;
      /* sabit id: iki cihaz aynı ayı ayrı ayrı eklerse senkronda tek kayda iner */
      if(r.auto&&acc(r.acc)){S.tx.push({id:`r-${r.id}-${mo}`,type:'gider',acc:r.acc,cat:r.cat,note:r.name,amount:r.amount,date,rec:r.id});r.done.push(mo);changed=true}

}

        <div class="mute">Dönem içi harcama: ${tl(e.donem)} · Sonraki ekstre (${fd(e.nc)}): ${tl(e.sonraki)}</div></div>`
      :k?'<div class="mute">Ekstre için kesim günü girin (karta dokunun).</div>':''}</div>`}).join('')+'</div>'
    +(S.accounts.length?'':'<div class="card mute empty">Henüz hesap yok. Nakit, banka veya kartınızı ekleyerek başlayın.</div>')
    +`<button class="btn add" data-act="newacc">${icon('plus')}Hesap ekle</button>`;
}
function syncCard(){
  if(SY.cfg)return `<div class="card"><b class="ftitle">Senkron</b><div class="mute">${esc(SY.cfg.owner)}/${esc(SY.cfg.repo)} · şifreli</div>
    <div id="syncst" class="mute" style="margin-top:6px"></div>
    <button class="btn" data-act="syncnow">Şimdi eşitle</button><button class="btn alt" data-act="syncoff">Bu cihazda bağlantıyı kes</button></div>`;
  return `<div class="card"><b class="ftitle">Senkron</b><div class="mute">Telefon ve bilgisayar aynı veriyi görsün. Veri bu cihazda şifrelenip özel GitHub reponuza yazılır.</div>
  <form id="sform"><label>GitHub kullanıcı adı</label><input name="owner" value="siborgafro" autocapitalize="off" autocorrect="off" spellcheck="false" required>
  <label>Repo</label><input name="repo" value="metelik-veri" autocapitalize="off" autocorrect="off" spellcheck="false" required>
  <label>Erişim anahtarı (token)</label><input name="token" type="password" autocomplete="off" required>
  <label>Senkron şifresi (en az 8 karakter)</label><input name="pass" type="password" autocomplete="new-password" minlength="8" required>
  <div class="mute">Tüm cihazlarda aynı şifreyi girin. Unutulursa buluttaki kopya açılamaz; cihazdaki veri yerinde kalır.</div>
  <div id="sform-st" class="mute" style="margin-top:6px"></div><button class="btn" type="submit">Bağlan</button></form></div>`}
function ayar(){
  const B=S.budgets||{};
  return `<h1>Ayarlar</h1><div class="acols">${syncCard()}<div class="card"><b class="ftitle">Kategoriler</b><div class="mute">Silinen kategorideki eski işlemler olduğu gibi kalır.</div>
  ${['gider','gelir'].map(t=>`<label>${t==='gider'?'Gider':'Gelir'}</label>
    <div class="chips">${KAT(t).map(c=>`<span class="cat">${esc(c)}<button data-delcat="${esc(c)}" data-ct="${t}" aria-label="${esc(c)} sil">${icon('x','s')}</button></span>`).join('')}</div>
    <div class="row" style="margin-top:8px"><input id="newcat-${t}" maxlength="24" aria-label="Yeni ${t} kategorisi" placeholder="${t==='gider'?'Örn. Elektrik, Su, İnternet':'Örn. Kira geliri'}" style="flex:1"><button class="mini" data-addcat="${t}">Ekle</button></div>`).join('')}</div>
  <div class="card"><b class="ftitle">Aylık bütçe limitleri</b><div class="mute">Her ay için geçerli. Boş bırakılan kategoride limit yok. Taksitler ödendiği ayın bütçesine yazılır.</div>
  <form id="bform">${KAT('gider').map(c=>`<label>${esc(c)}</label><input name="${esc(c)}" inputmode="decimal" placeholder="Limit yok" value="${kurusStr(B[c])}">`).join('')}
  <button class="btn" type="submit">Bütçeyi kaydet</button></form></div>
  <div class="card"><b class="ftitle">Yedek</b><div class="mute">iOS kullanılmayan web uygulama verisini silebilir. Düzenli yedek alın.</div>
  <button class="btn" data-act="export">Verileri dışa aktar (JSON)</button>
  <button class="btn alt" data-act="import">Yedekten içe aktar</button>
  <input type="file" id="file" accept="application/json" hidden></div>
  <div class="card"><b class="ftitle">Sıfırla</b><div class="mute">Tüm hesaplar, işlemler, tekrar edenler ve bütçeler silinir; kategoriler varsayılana döner.${SY.cfg?' Senkron açık: diğer cihazlar da sıfırlanır.':''} Önce yedek alın.</div>
  <button class="btn alt" data-act="reset">Tüm verileri sıfırla</button></div></div>`;
}

/* --- formlar --- */
let F={type:'gider'};
function openTx(){
  if(!S.accounts.length){alert('Önce bir hesap ekleyin.');tab='hesap';render();return}
  F={type:'gider'};drawTx();openSheet();
}
function drawTx(){
  const t=F.type,opts=S.accounts.map(a=>`<option value="${a.id}">${esc(a.name)}</option>`).join('');
  const card=acc(F.acc||S.accounts[0].id)?.type==='kart';
  $('#form').innerHTML=`<div class="seg" role="group" aria-label="İşlem türü">${['gider','gelir','transfer'].map(k=>`<button type="button" data-ftype="${k}" class="${t===k?'on':''}" aria-pressed="${t===k}">${{gider:'Gider',gelir:'Gelir',transfer:'Transfer / Kart'}[k]}</button>`).join('')}</div>
  <label>Tutar (TL)</label><input name="amount" inputmode="decimal" required placeholder="0,00" autofocus>
  <label>${t==='transfer'?'Açıklama':'Ad'}</label><input name="note" placeholder="${t==='gider'?'Örn. Migros, Netflix, Elektrik':t==='gelir'?'Örn. Ekim maaşı':'İsteğe bağlı'}">
  <label>${t==='transfer'?'Kaynak hesap':'Hesap'}</label><select name="acc">${opts}</select>
  ${t==='transfer'?`<label>Hedef hesap (kart borcu ödemesi için kartı seçin)</label><select name="to">${opts}</select>`:`<label>Kategori</label><select name="cat">${catOpts(t,F.cat)}</select>`}
  <label>Tarih</label><input name="date" type="date" value="${today()}" required>
  ${t==='gider'?`<div id="instbox" style="${card?'':'display:none'}"><label>Taksit sayısı (1 = peşin)</label><input name="inst" type="number" min="1" max="36" value="1"></div>`:''}
  <button class="btn" type="submit">Kaydet</button><button class="btn alt" type="button" data-act="close">Vazgeç</button>`;
  if(F.acc)$('#form [name=acc]').value=F.acc;
  if(F.to&&$('#form [name=to]'))$('#form [name=to]').value=F.to;
  if(F.amount)$('#form [name=amount]').value=(F.amount/100).toFixed(2).replace('.',',');
  if(F.cat&&$('#form [name=cat]'))$('#form [name=cat]').value=F.cat;
  if(F.note)$('#form [name=note]').value=F.note;
  if(F.date)$('#form [name=date]').value=F.date;
  linkLabels($('#form'));
}
/* silinmiş bir kategori düzenlenen kayıtta hâlâ seçili kalabilsin */
function catOpts(t,sel){const L=KAT(t).includes(sel)||!sel?KAT(t):[...KAT(t),sel];
  return L.map(c=>`<option ${c===sel?'selected':''}>${esc(c)}</option>`).join('')}
function openRecPay(rid,mo){
  if(!S.accounts.length){alert('Önce bir hesap ekleyin.');return}
  const r=S.recurring.find(x=>x.id===rid);
  F={type:'gider',acc:acc(r.acc)?r.acc:undefined,amount:r.amount,cat:r.cat,note:r.name,date:recDate(r,mo),rec:r.id,recMo:mo};
  drawTx();openSheet();
}
function openRec(r){
  if(!S.accounts.length){alert('Önce bir hesap ekleyin.');tab='hesap';render();return}
  $('#form').innerHTML=`<b class="ftitle">${r?'Tekrar eden gideri düzenle':'Tekrar eden gider'}</b>
  <label>Ad</label><input name="name" required placeholder="Örn. Netflix, Elektrik, Telefon" value="${esc(r?.name)}">
  <label>Tutar (TL) — değişen faturalarda tahmini tutar</label><input name="amount" inputmode="decimal" required placeholder="0,00" value="${kurusStr(r?.amount)}">
  <label>Kategori</label><select name="cat">${catOpts('gider',r?.cat||'Fatura')}</select>
  <label>Hesap</label><select name="acc">${S.accounts.map(a=>`<option value="${a.id}" ${r?.acc===a.id?'selected':''}>${esc(a.name)}</option>`).join('')}</select>
  <label>Her ayın kaçında (1–31)</label><input name="day" type="number" min="1" max="31" required value="${r?.day||''}" placeholder="Örn. 5">
  <label style="display:flex;gap:10px;align-items:center;color:var(--cream);font-size:15px;margin-top:14px"><input type="checkbox" name="auto" style="width:auto" ${r?.auto?'checked':''}> Günü gelince otomatik ekle</label>
  <div class="mute">Sabit tutarlı aboneliklerde açın. Fatura gibi değişen tutarlarda kapalı bırakın: günü gelince Özet'te tutarı onaylarsınız.${r?'':' Günü bu ay geçtiyse ilk kayıt gelecek ay.'}</div>
  <button class="btn" type="submit">Kaydet</button><button class="btn alt" type="button" data-act="close">Vazgeç</button>`;
  $('#form').dataset.kind='rec';$('#form').dataset.edit=r?.id||'';openSheet();
}
function openPay(cardId,amount){
  const src=S.accounts.find(a=>a.type==='banka')||S.accounts.find(a=>a.type==='nakit');
  F={type:'transfer',to:cardId,amount,acc:src?.id};drawTx();$('#form [name=note]').value=acc(cardId).name+' ekstre ödemesi';openSheet();
}
const kurusStr=k=>k?(k/100).toFixed(2).replace('.',','):'';
function openAcc(a){
  /* iPhone ondalık klavyesinde eksi tuşu yok; işaret ayrı seçilir */
  const neg=a?a.opening<0:false;
  $('#form').innerHTML=`<b class="ftitle">${a?'Hesabı düzenle':'Yeni hesap'}</b><label>Hesap adı</label><input name="name" required placeholder="Örn. Ziraat, Cüzdan, Bonus Kart" value="${esc(a?.name)}">
  <label>Tür</label><select name="type">${Object.entries(TIP).map(([k,v])=>`<option value="${k}" ${a?.type===k?'selected':''}>${v}</option>`).join('')}</select>
  <label>Açılış bakiyesi (TL)</label>
  <div class="row"><input name="opening" inputmode="decimal" placeholder="0,00" value="${kurusStr(Math.abs(a?.opening||0))}" style="flex:1">
    <input type="hidden" name="sign" value="${neg?'-1':'1'}">
    <div class="seg" style="flex:0 0 132px" role="group" aria-label="Bakiye işareti"><button type="button" data-sign="1" class="${neg?'':'on'}" aria-label="Artı" aria-pressed="${!neg}">+</button><button type="button" data-sign="-1" class="${neg?'on':''}" aria-label="Eksi" aria-pressed="${neg}">−</button></div></div>
  <div class="mute" id="signhint">${a?.type==='kart'?'Kart borcu varsa − seçin.':'Ek hesap / eksi bakiye için − seçin.'}</div>
  <div id="kartbox" style="${a?.type==='kart'?'':'display:none'}">
  <label>Kart limiti (isteğe bağlı)</label><input name="limit" inputmode="decimal" value="${kurusStr(a?.limit)}">
  <label>Hesap kesim günü (1–31)</label><input name="cut" type="number" min="1" max="31" value="${a?.cut||''}" placeholder="Örn. 15">
  <label>Son ödeme: kesimden kaç gün sonra</label><input name="dueDays" type="number" min="1" max="31" value="${a?.dueDays??10}"></div>
  <button class="btn" type="submit">Kaydet</button><button class="btn alt" type="button" data-act="close">Vazgeç</button>`;
  $('#form').dataset.kind='acc';$('#form').dataset.edit=a?.id||'';openSheet();
}

$('#form').addEventListener('submit',async e=>{
  e.preventDefault();const f=new FormData(e.target);let warn='';
  if(e.target.dataset.kind==='rec'){
    const amount=toKurus(f.get('amount')),day=parseInt(f.get('day'));
    if(!(amount>0)||!(day>=1&&day<=31)){alert('Geçerli bir tutar ve gün girin.');return}
    const v={name:f.get('name').trim(),amount,cat:f.get('cat'),acc:f.get('acc'),day,auto:f.get('auto')==='on'};
    const ex=S.recurring.find(x=>x.id===e.target.dataset.edit);
    if(ex)Object.assign(ex,v);
    else{const t=today(),[y,m]=t.split('-').map(Number);
      const start=day>Number(t.slice(8))?t.slice(0,7):(m===12?`${y+1}-01`:`${y}-${String(m+1).padStart(2,'0')}`);
      S.recurring.push({id:id(),...v,start,done:[]})}
  }else if(e.target.dataset.kind==='acc'){
    const kart=f.get('type')==='kart',cut=parseInt(f.get('cut'));
    const o=toKurus(f.get('opening')||0)||0;
    const v={name:f.get('name').trim(),type:f.get('type'),opening:o<0?o:o*(f.get('sign')==='-1'?-1:1),limit:kart&&f.get('limit')?toKurus(f.get('limit')):0,
      cut:kart&&cut>=1&&cut<=31?cut:0,dueDays:Math.min(31,Math.max(1,parseInt(f.get('dueDays'))||10))};
    const ex=acc(e.target.dataset.edit);
    if(ex)Object.assign(ex,v);else S.accounts.push({id:id(),...v});
  }else{
    const amount=toKurus(f.get('amount'));if(!(amount>0)){alert('Geçerli bir tutar girin.');return}
    const base={type:F.type,acc:f.get('acc'),date:f.get('date'),note:f.get('note').trim()};
    if(F.rec&&F.type==='gider'){base.rec=F.rec;const r=S.recurring.find(x=>x.id===F.rec);if(r&&!r.done.includes(F.recMo))r.done.push(F.recMo)}
    if(F.type==='transfer'){
      if(base.acc===f.get('to')){alert('Kaynak ve hedef farklı olmalı.');return}
      S.tx.push({...base,id:id(),amount,to:f.get('to')});
    }else{
      base.cat=f.get('cat');const n=acc(base.acc).type==='kart'&&F.type==='gider'?Math.max(1,parseInt(f.get('inst'))||1):1;
      if(n===1)S.tx.push({...base,id:id(),amount});
      else{const plan=id(),each=Math.floor(amount/n);
        for(let i=0;i<n;i++)S.tx.push({...base,id:id(),date:addMonths(base.date,i),amount:i===n-1?amount-each*(n-1):each,inst:{plan,n:i+1,total:n}})}
      /* yalnız eşik geçildiğinde uyar: %80 ve %100 */
      const l=(S.budgets||{})[base.cat];
      if(F.type==='gider'&&l){const mo=base.date.slice(0,7),inMo=t=>t.type==='gider'&&t.cat===base.cat&&t.date.startsWith(mo);
        const sp=S.tx.filter(inMo).reduce((s,t)=>s+t.amount,0),added=n===1?amount:Math.floor(amount/n),prev=sp-added;
        if(prev<=l&&sp>l)warn=`${base.cat} bütçesi ${tl(sp-l)} aşıldı.`;else if(prev<l*.8&&sp>=l*.8)warn=`${base.cat} bütçesinin %${Math.round(sp/l*100)}'i kullanıldı.`}
    }
  }
  e.target.dataset.kind='';closeSheet();await save();render();
  if(warn)setTimeout(()=>alert(warn),50);
});
document.addEventListener('submit',async e=>{
  if(e.target.id!=='sform')return;e.preventDefault();const f=new FormData(e.target),st=$('#sform-st'),btn=e.target.querySelector('[type=submit]');
  btn.disabled=true;st.textContent='Bağlanıyor…';
  try{await connect({owner:f.get('owner').trim(),repo:f.get('repo').trim(),token:f.get('token').trim(),pass:f.get('pass')});render()}
  catch(err){st.innerHTML=`<span class="out">${esc(err.name==='OperationError'?'Şifre yanlış: buluttaki veri bu şifreyle açılamadı.':err.message||'Bağlanılamadı.')}</span>`;btn.disabled=false}
});
document.addEventListener('submit',async e=>{
  if(e.target.id!=='bform')return;e.preventDefault();const f=new FormData(e.target);
  S.budgets={};for(const c of KAT('gider')){const v=toKurus(f.get(c)||'');if(v>0)S.budgets[c]=v}
  await save();tab='ozet';render();
});

document.addEventListener('click',async e=>{
  const el=e.target.closest('button,[data-tab],[data-editacc],[data-editrec]');if(!el)return;const d=el.dataset;
  if(d.editacc)return openAcc(acc(d.editacc));
  if(d.editrec)return openRec(S.recurring.find(r=>r.id===d.editrec));
  if(d.recpay)return openRecPay(d.recpay,d.mo);
  if(d.recskip){const r=S.recurring.find(x=>x.id===d.recskip);r.done.push(d.mo);await save();return render()}
  if(d.delrec){if(confirm('Tekrar eden gider silinsin mi? Geçmiş işlemler kalır.')){S.recurring=S.recurring.filter(r=>r.id!==d.delrec);await save();render()}return}
  if(d.act==='newrec')return openRec();
  if(d.act==='syncnow')return sync();
  if(d.act==='syncoff'){if(confirm('Bu cihazın senkron bağlantısı kesilsin mi? Veriler silinmez.')){SY.cfg=null;SY.last=null;await kvPut('sync',null);render()}return}
  if(d.addcat){let v=$('#newcat-'+d.addcat).value.trim().replace(/\s+/g,' ');const L=KAT(d.addcat);if(!v)return;
    v=v[0].toLocaleUpperCase('tr')+v.slice(1);
    if(L.some(c=>c.toLocaleLowerCase('tr')===v.toLocaleLowerCase('tr'))){alert('Bu kategori zaten var.');return}
    /* "Diğer" hep sonda kalsın */
    const di=L.indexOf('Diğer');di<0?L.push(v):L.splice(di,0,v);await save();render();$('#newcat-'+d.addcat).focus();return}
  if(d.delcat){const L=KAT(d.ct);if(L.length<=1){alert('En az bir kategori kalmalı.');return}
    if(!confirm(`"${d.delcat}" kategorisi silinsin mi?`))return;
    S.cats[d.ct]=L.filter(c=>c!==d.delcat);if(d.ct==='gider')delete S.budgets[d.delcat];await save();render();return}
  if(d.pay)return openPay(d.pay,Number(d.amt));
  if(d.sign){$('#form [name=sign]').value=d.sign;el.parentNode.querySelectorAll('button').forEach(b=>{b.classList.toggle('on',b===el);b.setAttribute('aria-pressed',b===el)});return}
  if(el.id==='fab'||d.act==='add')return tab==='hesap'?openAcc():openTx();
  if(d.tab){tab=d.tab;render()}
  else if(d.m){const [y,m]=month.split('-').map(Number);month=new Date(Date.UTC(y,m-1+Number(d.m),1)).toISOString().slice(0,7);render()}
  else if(d.ftype){F.type=d.ftype;F.acc=$('#form [name=acc]')?.value;drawTx()}
  else if(d.del){const t=S.tx.find(x=>x.id===d.del);
    if(t.inst&&confirm('Bu bir taksit planı. Planın tüm taksitleri silinsin mi?\n(İptal: yalnız bu taksit)'))S.tx=S.tx.filter(x=>x.inst?.plan!==t.inst.plan);
    else if(confirm('İşlem silinsin mi?'))S.tx=S.tx.filter(x=>x.id!==d.del);
    await save();render()}
  else if(d.delacc){if(confirm('Hesap ve tüm işlemleri silinsin mi?')){S.tx=S.tx.filter(t=>t.acc!==d.delacc&&t.to!==d.delacc);S.accounts=S.accounts.filter(a=>a.id!==d.delacc);await save();render()}}
  else if(d.act==='newacc')openAcc();
  else if(d.act==='close'){$('#form').dataset.kind='';closeSheet()}
  else if(d.act==='export'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download=`metelik-yedek-${today()}.json`;a.click()}
  else if(d.act==='import')$('#file').click();
  else if(d.act==='reset'){
    if(!confirm('Tüm veriler silinsin mi?\nÖnce "Verileri dışa aktar" ile yedek almanız önerilir.'))return;
    if(prompt('Onaylamak için SIFIRLA yazın.')?.trim().toLocaleUpperCase('tr')!=='SIFIRLA')return;
    S.accounts=[];S.tx=[];S.recurring=[];S.budgets={};S.cats=JSON.parse(JSON.stringify(DEF_KAT));
    await save();render()}
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id?.startsWith('newcat-')){e.preventDefault();$(`[data-addcat="${e.target.id.slice(7)}"]`).click()}});
document.addEventListener('change',async e=>{
  if(e.target.id==='file'){const file=e.target.files[0];if(!file)return;
    try{const j=JSON.parse(await file.text());if(!Array.isArray(j.accounts)||!Array.isArray(j.tx))throw 0;
      if(confirm('Mevcut veri yedekle değiştirilsin mi?')){S=j;fillDefaults();await save();render()}}catch{alert('Geçersiz yedek dosyası.')}}
  if(e.target.name==='type'&&$('#kartbox')){const k=e.target.value==='kart';$('#kartbox').style.display=k?'':'none';
    $('#signhint').textContent=k?'Kart borcu varsa − seçin.':'Ek hesap / eksi bakiye için − seçin.'}
  if(e.target.name==='acc'&&$('#instbox'))$('#instbox').style.display=acc(e.target.value)?.type==='kart'?'':'none';
});

month=today().slice(0,7);
$('#sheet').addEventListener('close',()=>{$('#form').dataset.kind=''});
$('#sheet').addEventListener('click',e=>{if(e.target===$('#sheet'))closeSheet()});
if(navigator.standalone||matchMedia('(display-mode: standalone)').matches){
  const fill=()=>{document.body.style.minHeight=(innerWidth>innerHeight?Math.min(screen.width,screen.height):Math.max(screen.width,screen.height))+1+'px'};
  fill();addEventListener('resize',fill);
}
function fillDefaults(){S.budgets||={};S.recurring||=[];S.cats||=JSON.parse(JSON.stringify(DEF_KAT));S.deleted||={};S.meta||={}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync()});
(async()=>{const s=await load();if(s)S=s;fillDefaults();SNAP=snapOf();render();
  const c=await kvGet('sync');if(c?.key){SY.cfg=c;sync()}if('serviceWorker'in navigator){
  /* yeni sürüm devreye girince bir kez yenile; ilk kurulumda değil */
  const had=!!navigator.serviceWorker.controller;let done=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!done){done=true;location.reload()}});
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{})}})();
</script>

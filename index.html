<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1b33">
<meta name="apple-mobile-web-app-capable" content="yes">
<!-- black-translucent iOS 26'da görünüm yüksekliğini kısaltıyor: alt menü yukarıda kalıp altında boşluk açılıyordu -->
<meta name="apple-mobile-web-app-status-bar-style" content="black">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg">
<link rel="apple-touch-icon" href="icon-180.png">
<title>Metelik Cüzdan</title>
<style>
:root{--bg:#0f1b33;--card:#16264a;--line:#243659;--cream:#f3ead2;--gold:#d9a93b;--mute:#8b98b8;--red:#e5736b;--green:#6cc08b}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--cream);font:16px/1.4 system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:calc(150px + env(safe-area-inset-bottom))}
/* ana ekrandan açılınca sayfa çentik ve durum çubuğunun altına uzanır; güvenli alan kadar boşluk bırak */
main{max-width:520px;margin:0 auto;padding:calc(16px + env(safe-area-inset-top)) calc(16px + env(safe-area-inset-right)) 16px calc(16px + env(safe-area-inset-left))}
h1{font-size:20px;margin:0 0 12px;color:var(--gold)}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin:22px 0 8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
.row{display:flex;justify-content:space-between;align-items:center;gap:10px}
.mute{color:var(--mute);font-size:13px}
.in{color:var(--green)}.out{color:var(--red)}
.big{font-size:26px;font-weight:700}
.bar{height:6px;border-radius:3px;background:var(--line);margin-top:6px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--gold)}
.bar i.share{background:#5b6a8f}.bar i.ok{background:var(--green)}.bar i.over{background:var(--red)}
/* iOS 26 ana ekran uygulamasında sayfa ekrandan kısaysa görünüm kısalıyor ve sabit menü yukarıda kalıyordu;
   uzun (kaydırılabilir) sayfada sorun yok. JS sayfayı en az ekran yüksekliği kadar uzatır. */
:root{--navb:max(env(safe-area-inset-bottom),12px)}
html{background:var(--bg)}
.glass{background:rgba(26,42,78,.5);-webkit-backdrop-filter:blur(22px) saturate(180%);backdrop-filter:blur(22px) saturate(180%);
  border:1px solid rgba(255,255,255,.13);box-shadow:inset 0 1px 0 rgba(255,255,255,.2),inset 0 -1px 0 rgba(0,0,0,.25),0 10px 30px rgba(0,0,0,.45)}
nav{position:fixed;left:14px;right:14px;bottom:var(--navb);max-width:492px;margin:0 auto;display:flex;padding:5px;border-radius:999px;z-index:10}
nav button{flex:1;background:none;border:0;color:var(--mute);padding:11px 0;font-size:14px;border-radius:999px;transition:background .2s,color .2s}
nav button.on{color:var(--gold);font-weight:600;background:rgba(255,255,255,.11);box-shadow:inset 0 1px 0 rgba(255,255,255,.18)}
.fab{position:fixed;right:18px;bottom:calc(var(--navb) + 68px);width:56px;height:56px;border-radius:50%;border:1px solid rgba(255,255,255,.3);background:linear-gradient(180deg,#e6b956,#c99526);color:var(--bg);font-size:30px;font-weight:700;z-index:10;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.45),0 8px 22px rgba(0,0,0,.45)}
.sheet{position:fixed;inset:0;background:#000a;display:none;align-items:flex-end;z-index:20}
.sheet.show{display:flex}
.sheet form{background:var(--bg);width:100%;max-width:520px;margin:0 auto;border-radius:18px 18px 0 0;padding:16px 16px calc(16px + env(safe-area-inset-bottom));max-height:calc(100vh - env(safe-area-inset-top) - 12px);overflow:auto}
label{display:block;font-size:13px;color:var(--mute);margin:10px 0 4px}
input,select{width:100%;padding:11px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--cream);font-size:16px}
.seg{display:flex;gap:6px}
.seg button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--mute)}
.seg button.on{background:var(--gold);color:var(--bg);border-color:var(--gold);font-weight:600}
.btn{width:100%;padding:13px;border-radius:12px;border:0;background:var(--gold);color:var(--bg);font-size:16px;font-weight:700;margin-top:14px}
.btn.alt{background:var(--card);color:var(--cream);border:1px solid var(--line)}
.del{background:none;border:0;color:var(--mute);font-size:18px;padding:4px 8px}
.mini{background:var(--gold);color:var(--bg);border:0;border-radius:8px;padding:6px 12px;font-weight:700;font-size:14px}
.mini.alt{background:var(--card);color:var(--mute);border:1px solid var(--line);margin-right:8px}
[data-editrec]{cursor:pointer}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.cat{display:inline-flex;align-items:center;background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:3px 3px 3px 12px;font-size:14px}
.cat button{background:none;border:0;color:var(--mute);font-size:12px;padding:4px 8px}
.rtab{padding:4px 14px}
.rrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}
.rrow.skip{opacity:.5}.rr{display:flex;flex-direction:column;align-items:flex-end;gap:4px}
.chip{font-size:12px;color:var(--mute);border:1px solid var(--line);border-radius:999px;padding:2px 8px}.chip.in{color:var(--green);border-color:#2f5a44}
.rsum{padding:10px 0 8px;flex-wrap:wrap}
.stmt{border-top:1px solid var(--line);margin-top:10px;padding-top:8px;display:grid;gap:4px}
[data-editacc]{cursor:pointer}
.month{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}
.month button{width:40px;height:40px;border-radius:50%;color:var(--cream);font-size:20px;line-height:1;padding:0 0 2px}
</style>
</head>
<body>
<main id="app"></main>
<button class="fab" id="fab" aria-label="İşlem ekle">+</button>
<nav id="nav" class="glass"></nav>
<div class="sheet" id="sheet"><form id="form"></form></div>

<script>
/* varsayılanlar; kullanıcı Ayarlar'dan ekler/siler, liste S.cats içinde saklanır */
const KAT=t=>S.cats[t];
const DEF_KAT={gider:['Market','Yemek','Fatura','Abonelik','Ulaşım','Kira','Sağlık','Eğlence','Alışveriş','Kahve','Diğer'],gelir:['Maaş','Yemek kartı yüklemesi','Ek gelir','Diğer']};
const TIP={nakit:'Nakit',banka:'Banka',kart:'Kredi kartı',yemek:'Yemek kartı'};
let S={accounts:[],tx:[],budgets:{},recurring:[],cats:JSON.parse(JSON.stringify(DEF_KAT)),deleted:{},meta:{}},tab='ozet',month;

/* --- depolama (IndexedDB) --- */
const db=new Promise((res,rej)=>{let r;try{r=indexedDB.open('metelik',1)}catch(e){return rej(e)}r.onupgradeneeded=()=>r.result.createObjectStore('kv');r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)});
db.catch(()=>{});
async function kvGet(k){try{const d=await db;return await new Promise(res=>{const q=d.transaction('kv').objectStore('kv').get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>res(null)})}catch{return null}}
async function kvPut(k,v){try{const d=await db;await new Promise(res=>{const t=d.transaction('kv','readwrite');t.objectStore('kv').put(v,k);t.oncomplete=t.onerror=res})}catch{}}
const load=()=>kvGet('state');
async function persist(){await kvPut('state',JSON.parse(JSON.stringify(S)))}
async function save(){stamp();await persist();scheduleSync()}

/* --- değişiklik damgası ---
   Her kayıt değiştiğinde u = zaman; silinen kayıt S.deleted["tür:id"] = zaman olarak iz bırakır.
   Damgalama save() içinde son kaydedilen hâlle karşılaştırılarak yapılır; tek tek işlemlere dokunmak gerekmez. */
const COLS=['accounts','tx','recurring'],FIELDS=['budgets','cats'];
let SNAP=null;
function snapOf(){const m={};
  for(const c of COLS)for(const x of S[c]){const {u,...r}=x;m[c+':'+x.id]=JSON.stringify(r)}
  for(const f of FIELDS)m[f]=JSON.stringify(S[f]);return m}
function stamp(){const now=Date.now(),cur=snapOf();
  if(SNAP){for(const c of COLS)for(const x of S[c]){const k=c+':'+x.id;if(SNAP[k]!==cur[k])x.u=now}
    for(const k in SNAP)if(k.includes(':')&&!(k in cur))S.deleted[k]=now;
    for(const f of FIELDS)if(SNAP[f]!==cur[f])S.meta[f]=now}
  SNAP=cur}
/* iki sürümü birleştir: kayıt bazında yeni olan kazanır, silme izi kayıttan yeniyse kayıt düşer */
function merge(A,B){
  const out={deleted:{...A.deleted},meta:{}};
  for(const k in B.deleted)out.deleted[k]=Math.max(out.deleted[k]||0,B.deleted[k]);
  for(const c of COLS){const m=new Map();
    for(const x of [...A[c],...B[c]]){const o=m.get(x.id);
      if(!o)m.set(x.id,x);
      else{const w=(x.u||0)>(o.u||0)?x:o;
        m.set(x.id,c==='recurring'?{...w,done:[...new Set([...(o.done||[]),...(x.done||[])])]}:w)}}
    out[c]=[...m.values()].filter(x=>!(out.deleted[c+':'+x.id]>=(x.u||0)))}
  for(const f of FIELDS){const a=A.meta[f]||0,b=B.meta[f]||0;out[f]=b>a?B[f]:A[f];out.meta[f]=Math.max(a,b)}
  return out}

/* --- şifreli senkron (özel GitHub reposundaki tek dosya) ---
   Ayar cihazda kalır, senkron edilmez. Şifre saklanmaz; ondan türetilen, dışa aktarılamayan anahtar saklanır. */
const SY={cfg:null,busy:false,again:false,last:null,err:''};
const b64=u8=>{let s='';for(let i=0;i<u8.length;i+=8192)s+=String.fromCharCode(...u8.subarray(i,i+8192));return btoa(s)};
const unb64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function deriveKey(pass,salt){
  const base=await crypto.subtle.importKey('raw',new TextEncoder().encode(pass),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey({name:'PBKDF2',salt,iterations:310000,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['encrypt','decrypt'])}
async function seal(obj,key,salt){const iv=crypto.getRandomValues(new Uint8Array(12));
  const ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},key,new TextEncoder().encode(JSON.stringify(obj)));
  return JSON.stringify({v:1,salt:b64(salt),iv:b64(iv),ct:b64(new Uint8Array(ct))})}
async function unseal(txt,key){const f=JSON.parse(txt);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:unb64(f.iv)},key,unb64(f.ct));return JSON.parse(new TextDecoder().decode(pt))}
function gh(cfg,path,opt={}){return fetch(`${cfg.api||'https://api.github.com'}/repos/${cfg.owner}/${cfg.repo}/${path}`,{cache:'no-store',...opt,
  headers:{Authorization:'Bearer '+cfg.token,Accept:'application/vnd.github+json',...(opt.body?{'Content-Type':'application/json'}:{})}})}
const FILE='contents/metelik.json';
/* uzak dosya: {sha,text} ya da yoksa null */
async function remoteGet(cfg){
  const r=await gh(cfg,FILE);if(r.status===404)return null;
  if(!r.ok)throw new Error(r.status===401?'Anahtar geçersiz veya süresi dolmuş.':r.status===403?'Anahtarın bu repoya yazma izni yok.':'GitHub hatası '+r.status);
  const j=await r.json();let c=j.content;
  if(!c){const b=await gh(cfg,'git/blobs/'+j.sha);c=(await b.json()).content}
  return {sha:j.sha,text:atob(c.replace(/\n/g,''))}}
async function remotePut(cfg,text,sha){
  const r=await gh(cfg,FILE,{method:'PUT',body:JSON.stringify({message:'Metelik senkron',content:btoa(text),...(sha?{sha}:{})})});
  if(r.status===409||r.status===422)return false;if(!r.ok)throw new Error('GitHub yazma hatası '+r.status);return true}
async function sync(){
  const cfg=SY.cfg;if(!cfg)return;if(SY.busy){SY.again=true;return}
  SY.busy=true;SY.err='';syncBadge();
  try{for(let i=0;i<4;i++){
      const rem=await remoteGet(cfg),R=rem?await unseal(rem.text,cfg.key):null,M=R?merge(S,R):S;
      if(canon(M)!==canon(S)){Object.assign(S,M);SNAP=snapOf();await persist();render()}
      if(R&&canon(M)===canon(R))break;
      if(await remotePut(cfg,await seal(S,cfg.key,unb64(cfg.salt)),rem?.sha))break;
      if(i===3)throw new Error('Çakışma çözülemedi, tekrar deneyin.')}
    SY.last=new Date()}
  catch(e){SY.err=e.name==='OperationError'?'Senkron şifresi bu veriyi açamadı.':e.message||'Bağlantı hatası'}
  SY.busy=false;syncBadge();if(SY.again){SY.again=false;sync()}}
/* sıra bağımsız karşılaştırma: anahtarlar ve id'li diziler sıralanır */
function canon(o){const key=x=>x&&typeof x==='object'&&'id'in x?'#'+x.id:JSON.stringify(x);
  const s=v=>Array.isArray(v)?v.map(s).sort((a,b)=>{const x=key(a),y=key(b);return x<y?-1:x>y?1:0})
  :v&&typeof v==='object'?Object.fromEntries(Object.keys(v).sort().map(k=>[k,s(v[k])])):v;
  return JSON.stringify(s({accounts:o.accounts,tx:o.tx,recurring:o.recurring,budgets:o.budgets,cats:o.cats,deleted:o.deleted,meta:o.meta}))}
let syncT;function scheduleSync(){if(!SY.cfg)return;clearTimeout(syncT);syncT=setTimeout(sync,1500)}
/* ilk bağlantı: uzakta dosya varsa şifreyi onunla doğrula, yoksa yeni tuz üret */
async function connect(c){
  const rem=await remoteGet(c);let salt;
  if(rem){salt=unb64(JSON.parse(rem.text).salt);c.key=await deriveKey(c.pass,salt);await unseal(rem.text,c.key)}
  else{salt=crypto.getRandomValues(new Uint8Array(16));c.key=await deriveKey(c.pass,salt)}
  delete c.pass;c.salt=b64(salt);SY.cfg=c;await kvPut('sync',c);await sync()}
function syncBadge(){const el=$('#syncst');if(!el)return;
  el.innerHTML=SY.busy?'Eşitleniyor…':SY.err?`<span class="out">${esc(SY.err)}</span>`:SY.last?`Son eşitleme ${SY.last.toLocaleTimeString('tr-TR',{hour:'2-digit',minute:'2-digit'})} ✓`:'Henüz eşitlenmedi'}

/* --- yardımcılar --- */
const $=s=>document.querySelector(s);
const id=()=>Math.random().toString(36).slice(2,10);
/* yerel tarih: toISOString UTC verir, gece yarısından sonra bir önceki güne düşerdi */
const today=()=>{const t=new Date();return `${t.getFullYear()}-${String(t.getMonth()+1).padStart(2,'0')}-${String(t.getDate()).padStart(2,'0')}`};
const tl=k=>((k||0)/100).toLocaleString('tr-TR',{style:'currency',currency:'TRY'});
/* "1.500", "1.500,50", "1500,5" ve "1500.5" hepsi kabul edilir */
const toKurus=v=>{let s=String(v).trim().replace(/[\s₺]/g,'');
  if(s.includes(','))s=s.replace(/\./g,'').replace(',','.');else if(/^-?\d{1,3}(\.\d{3})+$/.test(s))s=s.replace(/\./g,'');
  return Math.round(parseFloat(s)*100)};
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const acc=i=>S.accounts.find(a=>a.id===i);
function addMonths(ds,n){const [y,m,d]=ds.split('-').map(Number);const t=new Date(Date.UTC(y,m-1+n,1));const last=new Date(Date.UTC(t.getUTCFullYear(),t.getUTCMonth()+1,0)).getUTCDate();t.setUTCDate(Math.min(d,last));return t.toISOString().slice(0,10)}
function monthLabel(m){const [y,mo]=m.split('-');return new Date(y,mo-1,1).toLocaleDateString('tr-TR',{month:'long',year:'numeric'})}
/* bakiye: opening + gelir - gider + transfer; yalnız bugüne kadar olanlar. Kartta negatif = borç */
function delta(t,a){if(t.type==='gelir'&&t.acc===a)return t.amount;if(t.type==='gider'&&t.acc===a)return -t.amount;if(t.type==='transfer'){if(t.acc===a)return -t.amount;if(t.to===a)return t.amount}return 0}
function balanceAt(a,date){return (acc(a).opening||0)+S.tx.filter(t=>t.date<=date).reduce((s,t)=>s+delta(t,a),0)}
const balance=a=>balanceAt(a,today());
const fd=d=>d.split('-').reverse().slice(0,2).join('.');
function addDays(ds,n){const t=new Date(ds+'T00:00:00Z');t.setUTCDate(t.getUTCDate()+n);return t.toISOString().slice(0,10)}
/* ay sonunu aşan kesim günü o ayın son gününe kayar */
function cutDate(y,m0,c){const last=new Date(Date.UTC(y,m0+1,0)).getUTCDate();return new Date(Date.UTC(y,m0,Math.min(c,last))).toISOString().slice(0,10)}
/* ekstre: son kesimdeki borç; kesimden sonraki ödemeler düşülür. Kesim günü yapılan harcama o ekstreye girer */
function ekstre(a){
  if(a.type!=='kart'||!a.cut)return null;
  const [ty,tm]=today().split('-').map(Number);
  let lc=cutDate(ty,tm-1,a.cut);if(lc>today())lc=cutDate(ty,tm-2,a.cut);
  const [y,m]=lc.split('-').map(Number),nc=cutDate(y,m,a.cut),due=addDays(lc,a.dueDays??10);
  const stmt=Math.max(0,-balanceAt(a.id,lc));
  const paid=S.tx.filter(t=>t.date>lc&&t.date<=today()&&((t.type==='transfer'&&t.to===a.id)||(t.type==='gelir'&&t.acc===a.id))).reduce((s,t)=>s+t.amount,0);
  const spend=(from,to)=>S.tx.filter(t=>t.acc===a.id&&(t.type==='gider'||t.type==='transfer')&&t.date>from&&t.date<=to).reduce((s,t)=>s+t.amount,0);
  const rem=Math.max(0,stmt-paid);
  return {lc,nc,due,stmt,rem,donem:spend(lc,today()),sonraki:spend(lc,nc),late:rem>0&&today()>due,left:Math.round((Date.parse(due)-Date.parse(today()))/864e5)};
}
function futureInstallments(a){return S.tx.filter(t=>t.acc===a&&t.type==='gider'&&t.date>today()).reduce((s,t)=>s+t.amount,0)}

/* --- görünümler --- */
/* --- tekrar eden giderler ---
   r.start: ilk ay (YYYY-MM), r.done: işlenmiş aylar (ödendi/atlandı/otomatik eklendi).
   İşlem silinse de ay "done" kaldığı için tekrar oluşmaz. */
function recMonths(r){const out=[];let [y,m]=r.start.split('-').map(Number);const [ty,tm]=today().split('-').map(Number);
  while(y<ty||(y===ty&&m<=tm)){out.push(`${y}-${String(m).padStart(2,'0')}`);if(++m>12){m=1;y++}}return out}
function recDate(r,mo){const [y,m]=mo.split('-').map(Number);return cutDate(y,m-1,r.day)}
/* otomatik olanları ekler; onay bekleyenleri döndürür */
function pendingRecs(){
  const p=[];let changed=false;
  for(const r of S.recurring){r.done||=[];
    for(const mo of recMonths(r)){
      if(r.done.includes(mo))continue;const date=recDate(r,mo);if(date>today())continue;
      /* sabit id: iki cihaz aynı ayı ayrı ayrı eklerse senkronda tek kayda iner */
      if(r.auto&&acc(r.acc)){S.tx.push({id:`r-${r.id}-${mo}`,type:'gider',acc:r.acc,cat:r.cat,note:r.name,amount:r.amount,date,rec:r.id});r.done.push(mo);changed=true}
      else p.push({r,mo,date})}}
  if(changed)save();
  return p.sort((a,b)=>a.date.localeCompare(b.date));
}
function render(){
  pendingRecs();
  $('#nav').innerHTML=[['ozet','Özet'],['islem','İşlemler'],['hesap','Hesaplar'],['ayar','Ayarlar']].map(([k,l])=>`<button class="${tab===k?'on':''}" data-tab="${k}">${l}</button>`).join('');
  $('#fab').style.display=tab==='ayar'?'none':'block';
  $('#app').innerHTML=({ozet,islem,hesap,ayar})[tab]();
  syncBadge();
}
function monthBar(){return `<div class="month"><button class="glass" data-m="-1" aria-label="Önceki ay">‹</button><b>${monthLabel(month)}</b><button class="glass" data-m="1" aria-label="Sonraki ay">›</button></div>`}
const inMonth=()=>S.tx.filter(t=>t.date.startsWith(month));

function ozet(){
  const m=inMonth(),gelir=m.filter(t=>t.type==='gelir').reduce((s,t)=>s+t.amount,0),gider=m.filter(t=>t.type==='gider').reduce((s,t)=>s+t.amount,0);
  const cats={};m.filter(t=>t.type==='gider').forEach(t=>cats[t.cat]=(cats[t.cat]||0)+t.amount);
  const B=S.budgets||{};Object.keys(B).forEach(c=>{if(B[c]>0)cats[c]=cats[c]||0});
  /* limitli kategoriler doluluk oranına göre önce, limitsizler tutara göre sonra */
  const cl=Object.entries(cats).sort((a,b)=>(!!B[b[0]]-!!B[a[0]])||(B[a[0]]?b[1]/B[b[0]]-a[1]/B[a[0]]:b[1]-a[1]));
  const bt=Object.values(B).reduce((s,v)=>s+v,0),bs=cl.filter(([c])=>B[c]).reduce((s,[,v])=>s+v,0);
  const [ty,tm]=today().split('-').map(Number),gecen=month===today().slice(0,7)?Math.round(Number(today().slice(8))/new Date(ty,tm,0).getDate()*100):null;

$('#form').addEventListener('submit',async e=>{
  e.preventDefault();const f=new FormData(e.target);let warn='';
  if(e.target.dataset.kind==='rec'){
    const amount=toKurus(f.get('amount')),day=parseInt(f.get('day'));
    if(!(amount>0)||!(day>=1&&day<=31)){alert('Geçerli bir tutar ve gün girin.');return}
    const v={name:f.get('name').trim(),amount,cat:f.get('cat'),acc:f.get('acc'),day,auto:f.get('auto')==='on'};
    const ex=S.recurring.find(x=>x.id===e.target.dataset.edit);
    if(ex)Object.assign(ex,v);
    else{const t=today(),[y,m]=t.split('-').map(Number);
      const start=day>Number(t.slice(8))?t.slice(0,7):(m===12?`${y+1}-01`:`${y}-${String(m+1).padStart(2,'0')}`);
      S.recurring.push({id:id(),...v,start,done:[]})}
  }else if(e.target.dataset.kind==='acc'){
    const kart=f.get('type')==='kart',cut=parseInt(f.get('cut'));
    const o=toKurus(f.get('opening')||0)||0;
    const v={name:f.get('name').trim(),type:f.get('type'),opening:o<0?o:o*(f.get('sign')==='-1'?-1:1),limit:kart&&f.get('limit')?toKurus(f.get('limit')):0,
      cut:kart&&cut>=1&&cut<=31?cut:0,dueDays:Math.min(31,Math.max(1,parseInt(f.get('dueDays'))||10))};
    const ex=acc(e.target.dataset.edit);
    if(ex)Object.assign(ex,v);else S.accounts.push({id:id(),...v});
  }else{
    const amount=toKurus(f.get('amount'));if(!(amount>0)){alert('Geçerli bir tutar girin.');return}
    const base={type:F.type,acc:f.get('acc'),date:f.get('date'),note:f.get('note').trim()};
    if(F.rec&&F.type==='gider'){base.rec=F.rec;const r=S.recurring.find(x=>x.id===F.rec);if(r&&!r.done.includes(F.recMo))r.done.push(F.recMo)}
    if(F.type==='transfer'){
      if(base.acc===f.get('to')){alert('Kaynak ve hedef farklı olmalı.');return}
      S.tx.push({...base,id:id(),amount,to:f.get('to')});
    }else{
      base.cat=f.get('cat');const n=acc(base.acc).type==='kart'&&F.type==='gider'?Math.max(1,parseInt(f.get('inst'))||1):1;
      if(n===1)S.tx.push({...base,id:id(),amount});
      else{const plan=id(),each=Math.floor(amount/n);
        for(let i=0;i<n;i++)S.tx.push({...base,id:id(),date:addMonths(base.date,i),amount:i===n-1?amount-each*(n-1):each,inst:{plan,n:i+1,total:n}})}
      /* yalnız eşik geçildiğinde uyar: %80 ve %100 */
      const l=(S.budgets||{})[base.cat];
      if(F.type==='gider'&&l){const mo=base.date.slice(0,7),inMo=t=>t.type==='gider'&&t.cat===base.cat&&t.date.startsWith(mo);
        const sp=S.tx.filter(inMo).reduce((s,t)=>s+t.amount,0),added=n===1?amount:Math.floor(amount/n),prev=sp-added;
        if(prev<=l&&sp>l)warn=`${base.cat} bütçesi ${tl(sp-l)} aşıldı.`;else if(prev<l*.8&&sp>=l*.8)warn=`${base.cat} bütçesinin %${Math.round(sp/l*100)}'i kullanıldı.`}
    }
  }
  e.target.dataset.kind='';$('#sheet').classList.remove('show');await save();render();
  if(warn)setTimeout(()=>alert(warn),50);
});
document.addEventListener('submit',async e=>{
  if(e.target.id!=='sform')return;e.preventDefault();const f=new FormData(e.target),st=$('#sform-st'),btn=e.target.querySelector('[type=submit]');
  btn.disabled=true;st.textContent='Bağlanıyor…';
  try{await connect({owner:f.get('owner').trim(),repo:f.get('repo').trim(),token:f.get('token').trim(),pass:f.get('pass')});render()}
  catch(err){st.innerHTML=`<span class="out">${esc(err.name==='OperationError'?'Şifre yanlış: buluttaki veri bu şifreyle açılamadı.':err.message||'Bağlanılamadı.')}</span>`;btn.disabled=false}
});
document.addEventListener('submit',async e=>{
  if(e.target.id!=='bform')return;e.preventDefault();const f=new FormData(e.target);
  S.budgets={};for(const c of KAT('gider')){const v=toKurus(f.get(c)||'');if(v>0)S.budgets[c]=v}
  await save();tab='ozet';render();
});

document.addEventListener('click',async e=>{
  const el=e.target.closest('button,[data-tab],[data-editacc],[data-editrec]');if(!el)return;const d=el.dataset;
  if(d.editacc)return openAcc(acc(d.editacc));
  if(d.editrec)return openRec(S.recurring.find(r=>r.id===d.editrec));
  if(d.recpay)return openRecPay(d.recpay,d.mo);
  if(d.recskip){const r=S.recurring.find(x=>x.id===d.recskip);r.done.push(d.mo);await save();return render()}
  if(d.delrec){if(confirm('Tekrar eden gider silinsin mi? Geçmiş işlemler kalır.')){S.recurring=S.recurring.filter(r=>r.id!==d.delrec);await save();render()}return}
  if(d.act==='newrec')return openRec();
  if(d.act==='syncnow')return sync();
  if(d.act==='syncoff'){if(confirm('Bu cihazın senkron bağlantısı kesilsin mi? Veriler silinmez.')){SY.cfg=null;SY.last=null;await kvPut('sync',null);render()}return}
  if(d.addcat){let v=$('#newcat-'+d.addcat).value.trim().replace(/\s+/g,' ');const L=KAT(d.addcat);if(!v)return;
    v=v[0].toLocaleUpperCase('tr')+v.slice(1);
    if(L.some(c=>c.toLocaleLowerCase('tr')===v.toLocaleLowerCase('tr'))){alert('Bu kategori zaten var.');return}
    /* "Diğer" hep sonda kalsın */
    const di=L.indexOf('Diğer');di<0?L.push(v):L.splice(di,0,v);await save();render();$('#newcat-'+d.addcat).focus();return}
  if(d.delcat){const L=KAT(d.ct);if(L.length<=1){alert('En az bir kategori kalmalı.');return}
    if(!confirm(`"${d.delcat}" kategorisi silinsin mi?`))return;
    S.cats[d.ct]=L.filter(c=>c!==d.delcat);if(d.ct==='gider')delete S.budgets[d.delcat];await save();render();return}
  if(d.pay)return openPay(d.pay,Number(d.amt));
  if(d.sign){$('#form [name=sign]').value=d.sign;el.parentNode.querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));return}
  if(el.id==='fab')return d.act||(tab==='hesap'?openAcc():openTx());
  if(d.tab){tab=d.tab;render()}
  else if(d.m){const [y,m]=month.split('-').map(Number);month=new Date(Date.UTC(y,m-1+Number(d.m),1)).toISOString().slice(0,7);render()}
  else if(d.ftype){F.type=d.ftype;F.acc=$('#form [name=acc]')?.value;drawTx()}
  else if(d.del){const t=S.tx.find(x=>x.id===d.del);
    if(t.inst&&confirm('Bu bir taksit planı. Planın tüm taksitleri silinsin mi?\n(İptal: yalnız bu taksit)'))S.tx=S.tx.filter(x=>x.inst?.plan!==t.inst.plan);
    else if(confirm('İşlem silinsin mi?'))S.tx=S.tx.filter(x=>x.id!==d.del);
    await save();render()}
  else if(d.delacc){if(confirm('Hesap ve tüm işlemleri silinsin mi?')){S.tx=S.tx.filter(t=>t.acc!==d.delacc&&t.to!==d.delacc);S.accounts=S.accounts.filter(a=>a.id!==d.delacc);await save();render()}}
  else if(d.act==='newacc')openAcc();
  else if(d.act==='close'){$('#form').dataset.kind='';$('#sheet').classList.remove('show')}
  else if(d.act==='export'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(S,null,1)],{type:'application/json'}));a.download=`metelik-yedek-${today()}.json`;a.click()}
  else if(d.act==='import')$('#file').click();
});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id?.startsWith('newcat-')){e.preventDefault();$(`[data-addcat="${e.target.id.slice(7)}"]`).click()}});
document.addEventListener('change',async e=>{
  if(e.target.id==='file'){const file=e.target.files[0];if(!file)return;
    try{const j=JSON.parse(await file.text());if(!Array.isArray(j.accounts)||!Array.isArray(j.tx))throw 0;
      if(confirm('Mevcut veri yedekle değiştirilsin mi?')){S=j;fillDefaults();await save();render()}}catch{alert('Geçersiz yedek dosyası.')}}
  if(e.target.name==='type'&&$('#kartbox')){const k=e.target.value==='kart';$('#kartbox').style.display=k?'':'none';
    $('#signhint').textContent=k?'Kart borcu varsa − seçin.':'Ek hesap / eksi bakiye için − seçin.'}
  if(e.target.name==='acc'&&$('#instbox'))$('#instbox').style.display=acc(e.target.value)?.type==='kart'?'':'none';
});

month=today().slice(0,7);
if(navigator.standalone||matchMedia('(display-mode: standalone)').matches){
  const fill=()=>{document.body.style.minHeight=(innerWidth>innerHeight?Math.min(screen.width,screen.height):Math.max(screen.width,screen.height))+1+'px'};
  fill();addEventListener('resize',fill);
}
function fillDefaults(){S.budgets||={};S.recurring||=[];S.cats||=JSON.parse(JSON.stringify(DEF_KAT));S.deleted||={};S.meta||={}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible')sync()});
(async()=>{const s=await load();if(s)S=s;fillDefaults();SNAP=snapOf();render();
  const c=await kvGet('sync');if(c?.key){SY.cfg=c;sync()}if('serviceWorker'in navigator){
  /* yeni sürüm devreye girince bir kez yenile; ilk kurulumda değil */
  const had=!!navigator.serviceWorker.controller;let done=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!done){done=true;location.reload()}});
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>r.update()).catch(()=>{})}})();
</script>
</body>
</html>
